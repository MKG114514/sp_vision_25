enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 0 # degree -2.5
pitch_offset: 6.8 # degree 2
comming_angle: 55 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.0 # s planner use this value

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true #是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 16
gain: 16
vid_pid: "2bdf:0001"

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]


# 重投影误差: 0.0869px
camera_matrix: [1814.7483737913715, 0, 737.46373807116106, 0, 1814.1974281900987, 586.26415178379341, 0, 0, 1]
distort_coeffs: [-0.075952165156952453, 0.16412293838332873, 0.0018349035089449497, -0.0012782284377191877, 0]

# 标定板到世界坐标系原点的水平距离: 1.13 m
# 标定板同竖直摆放时的偏角: yaw7.61 pitch13.92 roll-0.46 degree
# 标定板同竖直摆放时的偏角: yaw7.61 pitch13.92 roll-0.46 degree

R_camera2gimbal: [0.038016149317691816, -0.021397651408161321, 0.99904800330378019, -0.99926333651035582, 0.0044380067336515783, 0.038119396669197253, -0.005249447327720219, -0.9997611937910208, -0.021213172612945197]
t_camera2gimbal: [0.071288352887296763, 0.0088296151135547878, 0.088455156793578668]


#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####没用的东西，就是当记事本用
com_port: "/dev/ttyUSB0"
yaw_kp: 4500
yaw_kd: 0
pitch_kp: 8000
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"
yolox_buff_model: "assets/yolox_rune_3.6m.onnx"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s


height: 0   # 云台旋转中心到地面的高度（单位：米）
grid_num: 10     # 网格数量
grid_size: 0.2   # 每个网格边长（单位：米）
delay: 1         # 图像与云台数据的时间补偿（ms